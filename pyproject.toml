[project]
name = "bedrock-eval-gate"
version = "0.1.0"
description = "CI regression gate for Amazon Bedrock Knowledge Base retrieval and Bedrock Agent behavior"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Umer Karachiwala", email = "karachiwalaumer2612@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]

[project.scripts]
bedrock-eval-gate = "bedrock_eval_gate.cli:main"
bedrock-eval-gate-mcp = "bedrock_eval_gate.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 115
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
