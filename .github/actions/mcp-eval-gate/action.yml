name: "mcp-eval-gate"
description: "Gate a PR/deploy on MCP server tool regressions against a committed baseline."
branding:
  icon: "check-circle"
  color: "orange"

inputs:
  config:
    description: "Path to golden_set.yaml"
    required: false
    default: "golden_set.yaml"
  baseline:
    description: "Path to the committed baseline.json"
    required: false
    default: "baseline.json"
  html-report:
    description: "Path to write an HTML report (uploaded as a workflow artifact if set)"
    required: false
    default: "mcp-eval-report.html"
  anthropic-api-key:
    description: "Anthropic API key, only needed if the golden set has match_type: judge cases"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install mcp-eval-gate
      shell: bash
      run: pip install "mcp-eval-gate[judge]"

    - name: Run eval gate
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        mcp-eval-gate run --config "${{ inputs.config }}" --baseline "${{ inputs.baseline }}" --html-report "${{ inputs.html-report }}"

    - name: Upload HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mcp-eval-report
        path: ${{ inputs.html-report }}
        if-no-files-found: ignore
