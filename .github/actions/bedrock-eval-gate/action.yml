name: "bedrock-eval-gate"
description: "Gate a PR/deploy on Bedrock Knowledge Base retrieval and Agent regressions against a committed baseline."
branding:
  icon: "check-circle"
  color: "orange"

inputs:
  config:
    description: "Path to golden_set.yaml"
    required: false
    default: "golden_set.yaml"
  baseline:
    description: "Path to the committed baseline.json"
    required: false
    default: "baseline.json"
  aws-region:
    description: "AWS region override (defaults to the golden set's own `region` field)"
    required: false
    default: ""
  html-report:
    description: "Path to write an HTML report (uploaded as a workflow artifact if set)"
    required: false
    default: "bedrock-eval-report.html"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install bedrock-eval-gate
      shell: bash
      run: pip install bedrock-eval-gate

    - name: Run eval gate
      shell: bash
      env:
        AWS_REGION_OVERRIDE: ${{ inputs.aws-region }}
      run: |
        ARGS=(--config "${{ inputs.config }}" --baseline "${{ inputs.baseline }}" --html-report "${{ inputs.html-report }}")
        if [ -n "$AWS_REGION_OVERRIDE" ]; then
          ARGS+=(--region "$AWS_REGION_OVERRIDE")
        fi
        bedrock-eval-gate run "${ARGS[@]}"

    - name: Upload HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bedrock-eval-report
        path: ${{ inputs.html-report }}
        if-no-files-found: ignore
