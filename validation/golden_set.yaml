server:
  command: node
  args: ["servers/src/everything/dist/index.js", "stdio"]

cases:
  - id: echo-basic
    tool_name: echo
    tool_args:
      message: "mcp-eval-gate validation run"
    match_type: contains
    expected_output: "mcp-eval-gate validation run"

  - id: get-sum-basic
    tool_name: get-sum
    tool_args:
      a: 12
      b: 30
    match_type: exact
    expected_output: "The sum of 12 and 30 is 42."

  - id: get-sum-negative
    tool_name: get-sum
    tool_args:
      a: -5
      b: 5
    match_type: exact
    expected_output: "The sum of -5 and 5 is 0."

  - id: get-structured-content-nyc
    tool_name: get-structured-content
    tool_args:
      location: "New York"
    match_type: contains
    expected_output: "temperature"
