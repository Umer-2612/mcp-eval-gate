# Copy this into a consuming repo at .github/workflows/mcp-eval-gate.yml
name: MCP Eval Gate

on:
  pull_request:
    paths:
      - "golden_set.yaml"
      - "baseline.json"
      - "src/**" # adjust to wherever your MCP server's source lives

permissions:
  contents: read

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the MCP server under test
        run: npm ci && npm run build # swap for however your server is built/started

      - name: Run mcp-eval-gate
        uses: Umer-2612/mcp-eval-gate/.github/actions/mcp-eval-gate@v1
        with:
          config: golden_set.yaml
          baseline: baseline.json
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }} # only needed for match_type: judge cases
